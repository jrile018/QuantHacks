name: Source configuration checks
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
permissions:
  contents: read
  statuses: write
  pull-requests: read
  issues: read
concurrency:
  group: source-config-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  configuration:
    name: Trusted source configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      IS_PR: ${{ github.event_name == 'pull_request_target' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Mark source configuration pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=pending -f context=source-configuration \
            -f description="Checking source configuration and contribution scope"
      - name: Check out trusted base validation code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Check out candidate files as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check source-only PR eligibility with trusted code
        working-directory: trusted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$IS_PR" == "true" && "$HEAD_BRANCH" == codex/source-* ]]; then
            test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
            git -C ../candidate fetch --no-tags "$PWD" "$BASE_SHA"
            python scripts/check_source_pr.py --repo-root ../candidate \
              --base "$BASE_SHA" --head "$TARGET_SHA" --branch "$HEAD_BRANCH"
          elif [[ "$IS_PR" == "true" ]]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" > "$RUNNER_TEMP/shared-reviews.json"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" > "$RUNNER_TEMP/shared-comments.json"
            python scripts/check_shared_review.py --owner "$REPO_OWNER" --head "$TARGET_SHA" \
              --reviews "$RUNNER_TEMP/shared-reviews.json" --comments "$RUNNER_TEMP/shared-comments.json"
          else
            echo "Checking the merged main baseline."
          fi
      - name: Validate candidate source metadata and fixtures using trusted code
        working-directory: trusted
        run: python scripts/validate_team_sources.py --repo-root ../candidate
      - name: Run trusted validator and policy regression tests
        working-directory: trusted
        run: python -m unittest tests.test_source_validation tests.test_source_pr_policy tests.test_shared_review
      - name: Publish exact-head source configuration status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_RESULT: ${{ job.status }}
        run: |
          state=failure
          if [[ "$CHECK_RESULT" == "success" ]]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$state" -f context=source-configuration \
            -f description="Source configuration, fixtures and scope checked" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
