name: Source and adapter tests
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: source-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Source adapter tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-ocr.txt
      - name: Validate source configuration
        run: python scripts/validate_team_sources.py --repo-root .
      - name: Run offline tests and source adapters
        run: python -m unittest discover -s tests -v
      - name: Exercise the native intake smoke
        run: >-
          python scripts/run_document_batch.py
          --manifest examples/team_data/manifest.jsonl
          --output-dir data/processed/team_sources/ci-smoke
          --engine native
